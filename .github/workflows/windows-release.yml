name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Download and verify models
        run: python tools/download_models.py

      - name: Build executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Package release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist-win/PieFace.exe release/PieFace-windows-x64.exe
          Compress-Archive -Path dist-win/PieFace.exe -DestinationPath release/PieFace-windows-x64.zip

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PieFace-windows-x64
          path: release/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
